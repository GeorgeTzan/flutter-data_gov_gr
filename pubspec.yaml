name: data_gov_gr
description: Unofficial Dart SDK for Greek Government Open Data (data.gov.gr).
version: 1.0.1
homepage: https://github.com/GeorgeTzan/flutter-data_gov_gr
repository: https://github.com/GeorgeTzan/flutter-data_gov_gr
issue_tracker: https://github.com/GeorgeTzan/flutter-data_gov_gr/issues
# publish_to: 'none' # Uncomment to prevent accidental publishing


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  dio: ^5.4.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  dio_smart_retry: ^7.0.1
  dio_cache_interceptor: ^4.0.6
  rxdart: ^0.28.0

dev_dependencies:
  build_runner: ^2.4.8
  freezed: ^3.2.5
  json_serializable: ^6.7.1
  test: ^1.24.9
  mocktail: ^1.0.3
  lints: ^3.0.0
