name: data_gov_gr
description: Unofficial Dart SDK for Greek Government Open Data (data.gov.gr).
version: 1.0.0
homepage: https://github.com/georgetzan/flutter-data_gov_gr
repository: https://github.com/georgetzan/flutter-data_gov_gr
issue_tracker: https://github.com/georgetzan/flutter-data_gov_gr/issues
